    <rect x="160" y="395" width="12" height="18" rx="4"/>
    <rect x="102" y="343" width="18" height="12" rx="4"/>
    <rect x="212" y="343" width="18" height="12" rx="4"/>

    <rect x="389" y="285" width="12" height="18" rx="4"/>
