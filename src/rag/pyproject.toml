[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r1-rag"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.135.2",
    "pypdf>=5.0.0",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
