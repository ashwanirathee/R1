name: Run RAG Tests

on:
  pull_request:
    paths:
      - "src/rag/**"
      - ".github/workflows/run_rag_tests.yaml"
  push:
    branches: ["main"]
    paths:
      - "src/rag/**"
      - ".github/workflows/run_rag_tests.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: src/rag/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Compile Python modules
        run: uv run python -m compileall run_rag.py src

      - name: Smoke import FastAPI app
        run: uv run python -c "from run_rag import app; assert app is not None"

      - name: Run current pytest suite
        run: uv run pytest tests
