name: Run LLM Tests

on:
  pull_request:
    paths:
      - "src/llm/**"
      - ".github/workflows/run_llm_tests.yaml"
  push:
    branches: ["main"]
    paths:
      - "src/llm/**"
      - ".github/workflows/run_llm_tests.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: src/llm/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Compile Python modules
        run: uv run python -m compileall app.py routes.py definitions.py utils.py client.py scripts

      - name: Smoke import FastAPI app
        run: uv run python -c "from app import app; assert app.title == 'r1-api'"

      - name: Run pytest when tests exist
        run: |
          if find . -path "./.venv" -prune -o -name "test_*.py" -print -quit | grep -q .; then
            uv run pytest
          else
            echo "No pytest tests found for src/llm; compile and import checks completed."
          fi

      - name: Regenerate promptfoo tests
        run: uv run python scripts/build_promptfoo_tests.py

      - name: Check generated promptfoo tests are committed
        working-directory: .
        run: git diff --exit-code -- src/llm/scripts/promptfoo_tests.yaml
